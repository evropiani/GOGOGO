name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOGOGO-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Read version
        id: ver
        run: echo "name=$(grep '^versionName=' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Every build of main (or a v* tag) publishes the APK as the release for the
      # current versionName; bump version.properties to start a new release.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: GO! GO! GO! v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          make_latest: true
          body: |
            Signed release APK of GO! GO! GO! v${{ steps.ver.outputs.name }}.
            Download the .apk below, open it on an Android 7.0+ phone and allow installing from this source.
